<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Client</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <script src="text/javascript" th:src="@{/js/alertScript.js}"></script>
  <script src="text/javascript" th:src="@{/js/clientScript.js}"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="container mt-5">
  <h2 class="text-center mb-4">Register Client</h2>
  <form action="/clientes/registrarCliente" class="form-crear" id="form-crear" method="POST">
    <!-- Personal Information -->
    <div class="form-group row">
      <label for="name" class="col-sm-2 col-form-label">Name</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" name="Name" id="name" placeholder="Enter Name">
      </div>
    </div>
    <div class="form-group row">
      <label for="firstSurname" class="col-sm-2 col-form-label">First Surname</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" id="firstSurname" name="FirstSurname" placeholder="Enter First Surname">
      </div>
    </div>
    <div class="form-group row">
      <label for="secondSurname" class="col-sm-2 col-form-label">Second Surname</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" name="SecondSurname" id="secondSurname" placeholder="Enter Second Surname">
      </div>
    </div>
    <div class="form-group row">
      <label for="idCard" class="col-sm-2 col-form-label">ID Card</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" name="IdCard" id="idCard" placeholder="Enter ID Card">
      </div>
    </div>

    <!-- Location Information -->
    <div class="form-group row">
      <label for="idProvince" class="col-sm-2 col-form-label">Province</label>
      <div class="col-sm-10">
        <input type="number" name="IdProvince" class="form-control" id="idProvince" placeholder="Enter Province ID">
      </div>
    </div>
    <div class="form-group row">
      <label for="idCanton" class="col-sm-2 col-form-label">Canton</label>
      <div class="col-sm-10">
        <input type="number" name="IdCanton" class="form-control" id="idCanton" placeholder="Enter Canton ID">
      </div>
    </div>
    <div class="form-group row">
      <label for="idDistrict" class="col-sm-2 col-form-label">District</label>
      <div class="col-sm-10">
        <input type="number" name="IdDistrict" class="form-control" id="idDistrict" placeholder="Enter District ID">
      </div>
    </div>
    <div class="form-group row">
      <label for="aditionalInformation" class="col-sm-2 col-form-label">Additional Information</label>
      <div class="col-sm-10">
        <input type="text" name="AditionalInformation" class="form-control" id="aditionalInformation" placeholder="Enter Additional Information">
      </div>
    </div>

    <!-- Contact Information -->
    <div class="form-group row">
      <label for="email" class="col-sm-2 col-form-label">Email</label>
      <div class="col-sm-10">
        <input type="email" name="Email" class="form-control" id="email" placeholder="Enter Email">
      </div>
    </div>
    <div class="form-group row">
      <label for="phoneNumber" class="col-sm-2 col-form-label">Phone Number</label>
      <div class="col-sm-10">
        <input type="text" name="PhoneNumber" class="form-control" id="phoneNumber" placeholder="Enter Phone Number">
      </div>
    </div>

    <!-- User Information -->
    <div class="form-group row">
      <label for="userName" class="col-sm-2 col-form-label">Username</label>
      <div class="col-sm-10">
        <input type="text" name="UserName" class="form-control" id="userName" placeholder="Enter Username">
      </div>
    </div>
    <div class="form-group row">
      <label for="password" class="col-sm-2 col-form-label">Password</label>
      <div class="col-sm-10">
        <input type="password" name="Password" class="form-control" id="password" placeholder="Enter Password">
      </div>
    </div>
    <div class="form-group row">
      <label for="activationToken" class="col-sm-2 col-form-label">Activation Token</label>
      <div class="col-sm-10">
        <input type="text" name="ActivationToken" class="form-control" id="activationToken" placeholder="Enter Activation Token">
      </div>
    </div>
    <div class="form-group row">
      <label for="verificationToken" class="col-sm-2 col-form-label">Verification Token</label>
      <div class="col-sm-10">
        <input type="text" name="VerificationToken" class="form-control" id="verificationToken" placeholder="Enter Verification Token">
      </div>
    </div>
    <div class="form-group row">
      <label for="budget" class="col-sm-2 col-form-label">Budget</label>
      <div class="col-sm-10">
        <input type="number" step="0.01" name="Budget" class="form-control" id="budget" placeholder="Enter Budget">
      </div>
    </div>
    <div class="form-group row">
      <label for="idRole" class="col-sm-2 col-form-label">Role ID</label>
      <div class="col-sm-10">
        <input type="number" name="IdRole" class="form-control" id="idRole" placeholder="Enter Role ID">
      </div>
    </div>
    <div class="form-group row">
      <div class="col-sm-10 offset-sm-2">
        <button onclick="validarCreacionClient()" type="submit" class="btn btn-primary">Register</button>
      </div>
    </div>
  </form>
</div>


<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
